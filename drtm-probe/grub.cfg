# COM1 = I/O port 0x3f8; change --unit if your serial console is on another port
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=3
menuentry "NOVA DRTM PoC" {
    search --no-floppy --file --set=root /nova/x86_64-nova
    multiboot2 /nova/x86_64-nova
    module2    /nova/root.elf
}
